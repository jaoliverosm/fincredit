name: Publicar imágenes y despliegue

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Construir y publicar imágenes (GHCR / Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Login a registro (GHCR si está configurado)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Construir y publicar imagen del servidor
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fincredit-server:latest
            ghcr.io/${{ github.repository_owner }}/fincredit-server:${{ github.sha }}

      - name: Login a Docker Hub (opcional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Construir y publicar imagen del servidor en Docker Hub (opcional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fincredit-server:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fincredit-server:${{ github.sha }}

      - name: Construir y publicar imagen del cliente
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fincredit-client:latest
            ghcr.io/${{ github.repository_owner }}/fincredit-client:${{ github.sha }}

      - name: Construir y publicar imagen del cliente en Docker Hub (opcional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fincredit-client:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fincredit-client:${{ github.sha }}

      - name: Generar SBOM (Syft) para imagen del servidor
        if: ${{ steps.login-to-ghcr.outputs.registry != '' || secrets.DOCKERHUB_USERNAME != '' }}
        uses: anchore/syft-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/fincredit-server:latest
          output-format: json
          output-file: server-sbom.json

      - name: Generar SBOM (Syft) para imagen del cliente
        if: ${{ steps.login-to-ghcr.outputs.registry != '' || secrets.DOCKERHUB_USERNAME != '' }}
        uses: anchore/syft-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/fincredit-client:latest
          output-format: json
          output-file: client-sbom.json

      - name: Subir SBOM del servidor como artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-sbom
          path: server-sbom.json

      - name: Subir SBOM del cliente como artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-sbom
          path: client-sbom.json

  deploy-placeholder:
    name: Paso de despliegue (placeholder)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Notificar despliegue
        run: |
          echo "Imágenes construidas y publicadas. Configure la acción de despliegue según su proveedor (Railway, Render, DockerSwarm, k8s, etc.)."
