<body class="bg-background text-on-background min-h-screen flex flex-col trust-pattern">
<!-- Login Container -->
<main class="flex-grow flex items-center justify-center px-lg py-xl">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant overflow-hidden">
<!-- Brand Header Section -->
<div class="pt-xl pb-lg px-xl flex flex-col items-center space-y-md">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary text-[40px]" data-icon="account_balance">account_balance</span>
</div>
<div class="text-center">
<h1 class="font-display-lg text-display-lg font-bold text-primary tracking-tight">FinCredit</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Gestión de crédito institucional</p>
</div>
</div>
<!-- Login Form Section -->
<div class="px-xl pb-xl">
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant block ml-base" for="email">CORREO ELECTRÓNICO</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="email" name="email" placeholder="ejemplo@fincredit.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">CONTRASEÑA</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">¿OLVIDASTE TU CONTRASEÑA?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-lg font-title-sm text-title-sm shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-xs group" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Trust Indicators -->
<div class="mt-xl pt-lg border-t border-outline-variant flex flex-col items-center space-y-md">
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-lg">
                        Acceso restringido para personal autorizado de FinCredit. Su sesión está siendo monitoreada por seguridad.
                    </p>
<div class="flex items-center gap-md opacity-40 grayscale">
<img alt="Secure" class="h-6 w-auto" data-alt="A clean, minimalist vector icon of a security padlock, rendered in a professional navy blue and white color scheme to symbolize institutional trust and data protection. The icon is placed against a soft neutral background to maintain a high-end corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwkYPSm4nXIOU0vlCgMfSD-KNjp9M4kNdaSyeOTSFbDV7sMwd88g40mTFlFrLr4CtORGd1ZLKQgaZejiDdJ2bOzF8sihY_KhS4m_wz99ay9kkWWz_h0ibKH1yTw_UgP1C1T-kpI_d19SAaM0-sjWJwzTfN7qaIt7i0IgD7atRb6Si1VyluLSTllpX9d_CyHdebkNfBOXS-mfKEnMfKkfA2yqO9mGNVuubJvD7Rp0mBl4ITU-GpI2R_Fthd3w4_Ibd9sMI0oxwi1So7"/>
<img alt="Protected" class="h-6 w-auto" data-alt="A sophisticated digital shield emblem representing cyber security and financial integrity. The shield is styled with sharp geometric lines and a deep navy blue palette that matches the FinCredit brand identity, suggesting a secure and reliable banking environment for credit professionals." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCe6kZbAvJO5KhEyM44WVJmcEhgQ_w34fW8RjscWVoBg3KLW566s4ikGpfa-u-8RZ53fIAQdTMO97X3wlhyDNdYeveG2g1MdDZ-gKG6-k7j64iCtHfhz8RNelU_Jkd3IOZ6Hk1vC-ggKwuEZEcm-QczwipW19aUJ-ASloifFyL04Gyf8Md_2-8Ay6acG7nQhwd--A5WU28z2r56mH1M5gkPO8P_L44L1zpqxDtdmI60ANKs_7I307doVFkgVobFCPP5s5fGOTtWr8_x"/>
</div>
</div>
</div>
</div>

<footer class="py-lg px-xl flex flex-col md:flex-row justify-between items-center gap-md">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-body-md" data-icon="verified_user">verified_user</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Sistema de Crédito Certificado</span>
</div>
<div class="flex gap-lg">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">POLÍTICA DE PRIVACIDAD</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">SOPORTE TÉCNICO</a>
</div>
