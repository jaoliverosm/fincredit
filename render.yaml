services:
  - type: web
    name: fincredit-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fincredit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://fincredit-frontend.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

databases:
  - name: fincredit-db
    plan: free
    region: oregon